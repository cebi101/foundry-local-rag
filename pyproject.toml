[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-local-rag"
version = "1.0.0"
description = "Microsoft Foundry Local ile tamamen çevrimdışı çalışan yerel RAG soru-cevap asistanı"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rag", "foundry-local", "llm", "offline", "sqlite", "embeddings"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Foundry Local's own SDK needs 3.11+; keep it out of the base install so the
# package still imports on macOS's system Python (with the offline backend).
foundry = ["foundry-local-sdk>=1.2; python_version >= '3.11'", "openai>=1.40; python_version >= '3.11'"]
ui = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

# No console_scripts entry point on purpose: `app/` is an interface layer that
# lives outside the installable package, so the CLI is run as
#   python -m app.cli ...
# from the repo root. Keeps the library and the UI cleanly separated.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
