name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The summer school is run on both Windows and macOS laptops, so
        # "it works on my machine" has to mean all three platforms. Ubuntu
        # stands in for Linux and is where the cheap jobs run.
        include:
          # 3.9 is macOS's system Python: the core library and the offline
          # backend must keep working there even though Foundry Local cannot.
          - os: ubuntu-latest
            python-version: "3.9"
          # 3.12 is the recommended version for the real setup.
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    env:
      # The corpus, the questions and every answer are Turkish. Without this,
      # redirected output on Windows falls back to the legacy code page and
      # dies with UnicodeEncodeError on the first 'ı'.
      PYTHONUTF8: "1"

    defaults:
      run:
        # Git Bash on the Windows runner, so one script works everywhere and
        # quoting of the Turkish smoke-test question stays identical.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Deliberately NOT installing foundry-local-sdk: CI must stay offline
        # and must not download gigabytes of model weights. Everything is
        # exercised through the hashing backend.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Smoke test the CLI end to end
        run: |
          python -m app.cli --backend hashing ingest
          python -m app.cli --backend hashing info
          python -m app.cli --backend hashing ask "Kosinüs benzerliği nedir?"

      - name: Retrieval quality gate
        # Unit tests catch broken code. They do not catch a prompt tweak or a
        # chunk-size change that quietly costs ten points of recall. This makes
        # retrieval quality a build-breaking property.
        run: python eval/evaluate.py --backend hashing --no-save --gate

      - name: Environment doctor
        # Informational: on CI this reports "Foundry Local not installed",
        # which is expected. Never fails the build. It also proves the platform
        # advice stays correct -- doctor.py must not tell the Windows runner to
        # install Homebrew.
        run: python scripts/doctor.py || true
